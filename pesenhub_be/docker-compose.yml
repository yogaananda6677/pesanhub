name: pesenhub

services:
  api:
    image: pesenhub-api:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [pesenhub]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pesenhub]

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.3.0
    restart: unless-stopped
    environment:
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH_USERNAME:?GOWA_BASIC_AUTH_USERNAME is required}:${GOWA_BASIC_AUTH_PASSWORD:?GOWA_BASIC_AUTH_PASSWORD is required}
      APP_UI_ENABLED: "false"
      MCP_ENABLED: "false"
      WHATSAPP_WEBHOOK: http://api:8080/webhooks/gowa
      WHATSAPP_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET:?GOWA_WEBHOOK_SECRET is required}
      WHATSAPP_WEBHOOK_EVENTS: message,message.ack
      WHATSAPP_WEBHOOK_IGNORE_JIDS: "@g.us"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "false"
    ports:
      - "3000:3000"
    volumes:
      - gowa_storage:/app/storages
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [pesenhub]

volumes:
  postgres_data:
  gowa_storage:

networks:
  pesenhub:
    driver: bridge
