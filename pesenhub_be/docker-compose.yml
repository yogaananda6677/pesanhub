name: pesenhub

services:
  api:
    image: pesenhub-api:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [pesenhub]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:?DATABASE_NAME is required}
      MYSQL_USER: ${DATABASE_USER:?DATABASE_USER is required}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pesenhub]

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.3.0
    restart: unless-stopped
    environment:
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH_USERNAME:?GOWA_BASIC_AUTH_USERNAME is required}:${GOWA_BASIC_AUTH_PASSWORD:?GOWA_BASIC_AUTH_PASSWORD is required}
      APP_UI_ENABLED: "true"
      MCP_ENABLED: "false"
      WHATSAPP_WEBHOOK: http://api:8080/webhooks/gowa
      WHATSAPP_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET:?GOWA_WEBHOOK_SECRET is required}
      WHATSAPP_WEBHOOK_EVENTS: message,message.ack
      WHATSAPP_WEBHOOK_IGNORE_JIDS: "@g.us"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "false"
    ports:
      - "3000:3000"
    volumes:
      - gowa_storage:/app/storages
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [pesenhub]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks: [pesenhub]

volumes:
  mysql_data:
  gowa_storage:
  ollama_storage:

networks:
  pesenhub:
    driver: bridge
