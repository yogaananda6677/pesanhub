<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PesenHub - Kasir & Manajemen Outlet</title>
  <style>
:root {
  --green: #176b4d;
  --green-dark: #104c38;
  --green-50: #eaf6f0;
  --ink: #18251f;
  --muted: #6c7972;
  --line: #dce4df;
  --warm: #f7f6f2;
  --white: #ffffff;
  --orange: #e98a15;
  --orange-50: #fff5e7;
  --red: #d7463e;
  --red-50: #fff0ee;
  --blue: #3676c8;
  --blue-50: #edf5ff;
  --shadow: 0 8px 30px rgba(22, 49, 37, .08);
  --radius: 16px;
}

* { box-sizing: border-box; }
html { background: var(--warm); }
body { margin: 0; color: var(--ink); background: var(--warm); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; }
button { min-width: 48px; min-height: 48px; color: inherit; }
input:not([type="checkbox"]), textarea { min-height: 48px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(23, 107, 77, .22); outline-offset: 2px; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell { min-height: 100svh; display: grid; grid-template-columns: 88px minmax(0, 1fr); }
.side-nav { position: sticky; top: 0; height: 100svh; z-index: 20; display: flex; flex-direction: column; align-items: center; padding: 16px 10px 18px; background: var(--green-dark); color: #d7eee4; }
.brand-mark, .mobile-brand { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 13px; color: white; background: var(--green); font-weight: 900; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.nav-stack { display: flex; width: 100%; flex: 1; flex-direction: column; gap: 7px; margin-top: 28px; }
.nav-item { position: relative; min-height: 58px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 13px; background: transparent; color: #bdd6ca; font-size: 10.5px; font-weight: 700; cursor: pointer; transition: .18s ease; }
.nav-item:hover { background: rgba(255,255,255,.08); color: white; }
.nav-item.active { background: white; color: var(--green-dark); box-shadow: 0 8px 18px rgba(0,0,0,.12); }
.nav-item b { position: absolute; top: 6px; right: 7px; min-width: 18px; height: 18px; padding: 0 4px; display: grid; place-items: center; border-radius: 99px; background: var(--red); color: white; font-size: 10px; }
.settings-item { flex: 0 0 auto; }

.workspace { min-width: 0; min-height: 100svh; }
.topbar { position: sticky; z-index: 15; top: 0; height: 70px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
.topbar-title { display: flex; align-items: center; gap: 11px; }
.topbar-title > div:last-child { display: flex; flex-direction: column; gap: 2px; }
.topbar-title strong { font-size: 16px; }
.topbar-title span { color: var(--muted); font-size: 12px; }
.mobile-brand { display: none; width: 38px; height: 38px; border-radius: 11px; }
.topbar-actions { display: flex; align-items: center; gap: 9px; }
.connection { min-height: 38px; padding: 0 13px; display: flex; align-items: center; gap: 7px; border: 1px solid #cce4da; border-radius: 99px; background: var(--green-50); color: var(--green-dark); font-size: 12px; font-weight: 800; cursor: pointer; }
.connection.offline { background: var(--orange-50); border-color: #f4d39f; color: #9e5c0d; }
.icon-btn, .avatar, .close-btn { border: 1px solid var(--line); background: white; cursor: pointer; }
.icon-btn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; }
.icon-btn i:empty, .icon-btn i.badge-dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px white; }
.avatar { width: 40px; height: 40px; border-radius: 50%; color: var(--green-dark); background: var(--green-50); border-color: #cde5db; font-weight: 850; font-size: 12px; }
.offline-banner { min-height: 42px; padding: 9px 24px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff3dc; color: #86510e; font-size: 13px; font-weight: 700; border-bottom: 1px solid #efd39d; }
.content { width: 100%; max-width: 1540px; margin: 0 auto; padding: 24px; }
.view-stack { display: grid; gap: 20px; }

.eyebrow { margin: 0 0 7px; color: var(--green); font-size: 11px; font-weight: 900; letter-spacing: .11em; text-transform: uppercase; }
.welcome-row, .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
.welcome-row h1, .page-heading h1 { margin: 0; font-size: clamp(25px, 2.4vw, 34px); line-height: 1.1; letter-spacing: -.03em; }
.welcome-row p:last-child, .page-heading p:last-child { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
.primary-btn, .secondary-btn, .text-btn, .full-primary, .checkout-btn, .reject-btn, .accept-btn { border: 0; cursor: pointer; font-weight: 800; transition: transform .12s ease, filter .12s ease; }
.primary-btn { min-height: 46px; padding: 0 17px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 12px; background: var(--green); color: white; white-space: nowrap; }
.primary-btn:hover, .full-primary:hover, .checkout-btn:hover, .accept-btn:hover { filter: brightness(.94); }
.primary-btn:active, .secondary-btn:active, .full-primary:active, .checkout-btn:active { transform: scale(.98); }
.secondary-btn { min-height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px; background: white; }
.text-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--green); background: transparent; font-size: 12px; }

.metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.metric-card { min-height: 122px; padding: 18px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: white; text-align: left; box-shadow: 0 3px 16px rgba(20,52,38,.04); cursor: pointer; }
.metric-card > svg { width: 18px; color: #9aa69f; }
.metric-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 13px; }
.metric-icon svg { width: 23px; }
.metric-card div { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 8px; }
.metric-card div span { color: var(--muted); font-size: 12px; font-weight: 800; }
.metric-card div strong { grid-row: 1 / 3; grid-column: 2; font-size: 32px; line-height: 1; }
.metric-card div small { margin-top: 4px; color: #8a958f; font-size: 11px; }
.metric-card.waiting .metric-icon { background: var(--orange-50); color: var(--orange); }
.metric-card.waiting div strong { color: #bb6b0b; }
.metric-card.cooking .metric-icon { background: var(--blue-50); color: var(--blue); }
.metric-card.cooking div strong { color: var(--blue); }
.metric-card.ready .metric-icon { background: var(--green-50); color: var(--green); }
.metric-card.ready div strong { color: var(--green); }

.home-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(290px, .75fr); gap: 16px; align-items: start; }
.panel, .attention-panel { border: 1px solid var(--line); border-radius: var(--radius); background: white; box-shadow: 0 4px 18px rgba(20,52,38,.04); }
.panel-heading { padding: 18px 19px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.panel-heading h2, .attention-title h2 { margin: 0; font-size: 16px; }
.panel-heading p, .attention-title p { margin: 3px 0 0; color: var(--muted); font-size: 11.5px; }
.compact-orders { padding: 4px 10px 10px; }
.compact-order { min-height: 72px; padding: 12px 9px; display: grid; grid-template-columns: 66px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; border-bottom: 1px solid #edf1ee; cursor: pointer; }
.compact-order:last-child { border-bottom: 0; }
.compact-order:hover { background: #fafcfb; }
.order-time { display: flex; flex-direction: column; gap: 3px; }
.order-time strong { font-size: 14px; }
.order-time span { color: var(--muted); font-size: 11px; }
.order-main { min-width: 0; }
.order-main > div { display: flex; align-items: center; gap: 7px; }
.order-main b { font-size: 13px; }
.order-main p { margin: 5px 0 0; overflow: hidden; color: var(--muted); font-size: 11.5px; white-space: nowrap; text-overflow: ellipsis; }
.source-badge { display: inline-flex; align-items: center; min-height: 20px; padding: 0 7px; border-radius: 99px; font-size: 9.5px; font-weight: 900; }
.source-whatsapp { background: #e7f7ed; color: #158144; }
.source-web { background: #ebf3ff; color: #2569b9; }
.source-kasir { background: #f0edff; color: #654db5; }
.status-pill { display: inline-flex; min-height: 24px; align-items: center; justify-content: center; padding: 0 9px; border-radius: 99px; font-size: 9.5px; font-weight: 900; white-space: nowrap; }
.status-menunggu, .status-diterima { background: var(--orange-50); color: #a65c08; }
.status-sedang-dibuat { background: var(--blue-50); color: #2d68ad; }
.status-siap-diambil { background: var(--green-50); color: var(--green); }
.status-selesai { background: #edf0ee; color: #63716a; }
.attention-panel { padding: 16px; background: #fffaf5; border-color: #f0dac1; }
.attention-title { display: flex; align-items: flex-start; gap: 10px; color: #8c4e0a; }
.attention-title > svg { margin-top: 2px; }
.attention-card { margin-top: 13px; padding: 14px; border: 1px solid #efcfaa; border-radius: 13px; background: white; }
.attention-card > div { display: flex; justify-content: space-between; align-items: center; }
.late-time { padding: 3px 7px; border-radius: 7px; background: var(--red-50); color: var(--red); font-size: 10px; font-weight: 900; }
.attention-card h3 { margin: 10px 0 4px; font-size: 13px; }
.attention-card p { margin: 0; color: var(--muted); font-size: 11.5px; }
.attention-card button { width: 100%; min-height: 38px; margin-top: 12px; display: flex; justify-content: center; align-items: center; gap: 5px; border: 0; border-radius: 10px; background: var(--green); color: white; font-size: 11.5px; font-weight: 850; cursor: pointer; }
.shift-note { margin-top: 12px; padding: 11px; display: flex; align-items: flex-start; gap: 9px; border-radius: 11px; background: #f7eee4; color: #775532; }
.shift-note svg { flex: 0 0 auto; }
.shift-note p { margin: 0; font-size: 10.5px; line-height: 1.45; }
.shift-note strong { display: block; }

.filter-bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.filter-scroll, .category-tabs { display: flex; align-items: center; gap: 7px; overflow-x: auto; scrollbar-width: none; }
.filter-scroll button, .category-tabs button { min-height: 38px; padding: 0 13px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; background: white; color: #526159; font-size: 11.5px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.filter-scroll button.active, .category-tabs button.active { border-color: var(--green); background: var(--green); color: white; }
.filter-scroll button span { min-width: 18px; height: 18px; padding: 0 4px; display: grid; place-items: center; border-radius: 99px; background: rgba(255,255,255,.22); font-size: 9px; }
.search-box { min-width: 250px; min-height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 11px; background: white; color: #829088; }
.search-box.grow { width: 100%; }
.search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; }
.order-board { display: grid; grid-template-columns: repeat(3, minmax(265px, 1fr)); gap: 14px; align-items: start; }
.order-card { position: relative; padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: white; box-shadow: 0 4px 18px rgba(20,52,38,.04); overflow: hidden; }
.order-card.late { border-color: #efc2bd; }
.order-card.late::before { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: var(--red); }
.order-card-head, .ticket-head, .order-card-head > div, .ticket-head > div { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
.order-card-head strong { font-size: 13px; }
.elapsed { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10.5px; font-weight: 800; }
.order-customer { margin: 14px 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; }
.customer-avatar { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: #eef4f0; color: var(--green); font-weight: 900; }
.customer-avatar.large { width: 46px; height: 46px; border-radius: 14px; }
.order-customer h3, .detail-customer h3 { margin: 0; font-size: 13px; }
.order-customer p, .detail-customer p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; }
.order-card ul, .kds-ticket ul, .incoming-body ul { margin: 0; padding: 12px 0 12px 22px; border-top: 1px solid #edf1ee; border-bottom: 1px solid #edf1ee; }
.order-card li { margin: 4px 0; font-size: 11.5px; }
.order-note { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; background: #fff8e9; color: #785321; font-size: 10.5px; font-weight: 650; }
.order-total { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
.order-total strong { font-size: 14px; }
.card-actions { margin-top: 13px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 8px; }
.card-actions .primary-btn { min-height: 42px; padding: 0 11px; font-size: 11px; }
.empty-state { min-height: 150px; grid-column: 1 / -1; padding: 24px; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; color: var(--muted); }
.empty-state > span { margin-bottom: 7px; font-size: 27px; }
.empty-state strong { color: var(--ink); font-size: 13px; }
.empty-state p { margin: 4px 0 0; max-width: 230px; font-size: 11px; line-height: 1.5; }

.order-entry { min-height: calc(100svh - 118px); display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 18px; }
.catalog-area { min-width: 0; }
.page-heading.compact { margin-bottom: 16px; }
.catalog-tools { display: flex; }
.category-tabs { padding: 11px 0 14px; }
.product-grid { display: grid; grid-template-columns: repeat(3, minmax(145px, 1fr)); gap: 12px; }
.product-card { padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: white; text-align: left; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.product-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.product-card:disabled { cursor: not-allowed; }
.product-photo { position: relative; height: 105px; display: grid; place-items: center; overflow: hidden; background: linear-gradient(135deg, #fff7e5, #f1e6cd); }
.product-photo::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,.75), transparent 35%); }
.product-photo > span { position: relative; z-index: 1; filter: drop-shadow(0 9px 10px rgba(86,48,8,.18)); font-size: 50px; transform: rotate(-4deg); }
.product-photo.has-image::after { background: linear-gradient(to top, rgba(18, 29, 24, .18), transparent 55%); }
.product-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.product-photo b, .product-photo em { position: absolute; z-index: 2; top: 9px; left: 9px; padding: 4px 7px; border-radius: 7px; background: var(--orange); color: white; font-size: 9px; font-style: normal; font-weight: 900; }
.product-photo em { inset: 50% auto auto 50%; transform: translate(-50%, -50%) rotate(-7deg); padding: 6px 12px; background: rgba(25,30,27,.82); font-size: 12px; }
.product-info { padding: 11px; }
.product-info > div { min-height: 42px; display: flex; flex-direction: column; gap: 3px; }
.product-info strong { font-size: 12px; line-height: 1.25; }
.product-info span { color: var(--muted); font-size: 9.5px; }
.product-info footer { margin-top: 9px; display: flex; align-items: center; justify-content: space-between; }
.product-info footer b { font-size: 12px; color: var(--green-dark); }
.product-info footer i { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; background: var(--green); color: white; font-style: normal; }
.product-card.sold-out { opacity: .52; filter: grayscale(.7); }
.cart-panel { position: sticky; top: 94px; align-self: start; max-height: calc(100svh - 118px); padding: 17px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: white; box-shadow: var(--shadow); }
.cart-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
.cart-head h2 { margin: 0; font-size: 16px; }
.cart-head p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; }
.cart-head svg { color: var(--green); }
.field-label { margin-top: 13px; display: grid; grid-template-columns: 1fr auto; gap: 6px; color: #4e5e55; font-size: 10.5px; font-weight: 850; }
.field-label > span { color: #99a49e; font-weight: 600; }
.field-label input, .field-label textarea { grid-column: 1 / -1; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fbfcfb; color: var(--ink); outline: 0; font-size: 11.5px; }
.field-label input { height: 40px; padding: 0 11px; }
.field-label textarea { min-height: 57px; padding: 10px 11px; resize: vertical; }
.cart-lines { flex: 1; min-height: 82px; max-height: 280px; margin-top: 9px; overflow-y: auto; }
.cart-line { padding: 10px 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; border-bottom: 1px solid #edf1ee; }
.line-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: #fff6e4; font-size: 21px; }
.line-copy { display: flex; min-width: 0; flex-direction: column; gap: 2px; }
.line-copy strong { overflow: hidden; font-size: 11px; white-space: nowrap; text-overflow: ellipsis; }
.line-copy span { color: var(--muted); font-size: 9px; }
.line-copy b { margin-top: 2px; color: var(--green-dark); font-size: 10.5px; }
.qty-control { display: flex; align-items: center; gap: 7px; }
.qty-control button { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: white; cursor: pointer; }
.qty-control span { min-width: 13px; text-align: center; font-size: 11px; font-weight: 850; }
.cart-summary { margin-top: 11px; padding-top: 10px; border-top: 1px dashed #cfd8d3; }
.cart-summary > div { display: flex; justify-content: space-between; margin: 6px 0; color: var(--muted); font-size: 10.5px; }
.cart-summary b { color: var(--ink); }
.cart-summary .grand-total { margin-top: 11px; padding-top: 10px; align-items: center; border-top: 1px solid var(--line); color: var(--ink); font-size: 12px; font-weight: 800; }
.grand-total strong { color: var(--green-dark); font-size: 18px; }
.checkout-btn { width: 100%; min-height: 52px; margin-top: 12px; padding: 0 13px; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; border-radius: 12px; background: var(--green); color: white; text-align: left; font-size: 11.5px; }
.checkout-btn:disabled, .full-primary:disabled { opacity: .45; cursor: not-allowed; }

.kds-legend { display: flex; align-items: center; gap: 12px; }
.kds-legend span { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10.5px; font-weight: 700; }
.dot { width: 8px; height: 8px; display: inline-block; border-radius: 50%; }
.dot.orange { background: var(--orange); }.dot.blue { background: var(--blue); }.dot.green { background: var(--green); }
.kds-board { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 13px; align-items: start; }
.kds-column { overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: #eef1ef; }
.kds-column > header { min-height: 66px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; border-top: 4px solid var(--orange); background: white; }
.kds-column > header span { color: var(--orange); font-size: 9px; font-weight: 950; letter-spacing: .1em; }
.kds-column > header h2 { margin: 2px 0 0; font-size: 15px; }
.kds-column > header > b { min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--orange-50); color: #a35c08; }
.kds-sedang-dibuat > header { border-top-color: var(--blue); }.kds-sedang-dibuat > header span { color: var(--blue); }.kds-sedang-dibuat > header > b { background: var(--blue-50); color: var(--blue); }
.kds-siap-diambil > header { border-top-color: var(--green); }.kds-siap-diambil > header span { color: var(--green); }.kds-siap-diambil > header > b { background: var(--green-50); color: var(--green); }
.kds-list { min-height: 260px; padding: 10px; display: grid; gap: 10px; align-content: start; }
.kds-ticket { padding: 14px; border: 1px solid #dce3df; border-radius: 12px; background: white; box-shadow: 0 4px 12px rgba(31,56,45,.05); }
.ticket-head strong { font-size: 13px; }.ticket-head > b { font-size: 10.5px; }
.kds-ticket h3 { margin: 12px 0 8px; font-size: 13px; }
.kds-ticket ul { padding: 9px 0 9px 20px; }
.kds-ticket li { margin: 6px 0; font-size: 13px; font-weight: 750; }

      return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(amount);
    }

    let toastTimer = null;
    function showToast(msg, type = "success") {
      state.toast = msg;
      state.toastType = type;
      render();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = "";
        render();
      }, 2600);
    }

    function setView(v) {
      state.view = v;
      state.moreOpen = false;
      render();
    }

    function openMore() {
      state.moreOpen = true;
      render();
    }

    function setFilter(f) {
      state.filter = f;
      render();
    }

    function setCategory(c) {
      state.category = c;
      render();
    }

    function toggleOnline() {
      state.online = !state.online;
      render();
    }

    function setIncoming(val) {
      state.incoming = val;
      render();
    }

    function setDetail(order) {
      state.detail = order;
      render();
    }

    function advanceOrder(id) {
      const order = state.orders.find(o => o.id === id);
      if (order && nextStatus[order.status]) {
        const updatedStatus = nextStatus[order.status];
        order.status = updatedStatus;
        if (state.detail && state.detail.id === id) {
          state.detail.status = updatedStatus;
        }
        showToast(`${id} dipindahkan ke ${updatedStatus}`);
        render();
      }
    }

    function quickAdd(productId) {
      const product = products.find(p => p.id === productId);
      if (!product || !state.availability[product.id]) return;
      if (["Nasi Goreng", "Mie & Kwetiau"].includes(product.category)) {
        state.selectedProduct = product;
        state.spicy = "Sedang";
        render();
        return;
      }
      addToCart(product, "");
    }

    function addToCart(product, spicyLevel) {
      const existing = state.cart.find(line => line.id === product.id && line.spicy === (spicyLevel || undefined));
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({ ...product, qty: 1, spicy: spicyLevel || undefined });
      }
      state.selectedProduct = null;
      showToast(`${product.name} ditambahkan`);
      render();
    }

    function changeQty(index, delta) {
      if (state.cart[index]) {
        state.cart[index].qty += delta;
        if (state.cart[index].qty <= 0) {
          state.cart.splice(index, 1);
        }
        render();
      }
    }

    function updateAvailability(productId, available) {
      const product = products.find((item) => item.id === productId);
      if (!product) return;
      state.availability[productId] = available;
      showToast(`${product.name} berhasil diperbarui menjadi ${available ? 'Tersedia' : 'Habis'}`, "success");
    }

        warning: "Koneksi lambat, perubahan disimpan di perangkat",
        error: "Pembaruan gagal. Periksa koneksi lalu coba lagi"
      };
      state.moreOpen = false;
      showToast(messages[type], type);
    }

    function completePayment() {
      const cartTotal = state.cart.reduce((sum, line) => sum + line.price * line.qty, 0);
      const newOrder = {
        id: `PH-${1259 + state.orders.length}`,
        customer: state.customer.trim() || "Pelanggan umum",
        source: "Kasir",
        status: "Diterima",
        time: new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }),
        elapsed: 0,
        total: cartTotal,
        paid: true,
        items: state.cart.map(line => `${line.qty}× ${line.name}${line.spicy ? ` · ${line.spicy}` : ""}`),
        note: state.orderNote.trim() || undefined
      };
      state.orders.unshift(newOrder);
      state.cart = [];
      state.customer = "";
      state.orderNote = "";
      state.paymentOpen = false;
      state.view = "orders";
      showToast(`${newOrder.id} berhasil dibuat`);
      render();
    }

      document.getElementById('sideNavStack').innerHTML = sideHTML;

      const bottomHTML = mobileNavItems.map(item => `
        <button class="${state.view === item.id || (item.id === 'more' && (state.moreOpen || state.view === 'menu')) ? 'active' : ''}" onclick="${item.id === 'more' ? 'openMore()' : "setView('" + item.id + "')"}">

      } else if (state.view === "new") {
        const cartTotal = state.cart.reduce((sum, line) => sum + line.price * line.qty, 0);
        const filteredProducts = products.filter(p => (state.category === "Semua" || p.category === state.category) && p.name.toLowerCase().includes(state.query.toLowerCase()));

        container.innerHTML = `
          <div class="order-entry">
            <section class="catalog-area">
              <div class="page-heading compact">
                <div>
                  <p class="eyebrow">PESANAN KASIR</p>
                  <h1>Buat pesanan</h1>
                  <p>Pilih menu, cek ringkasan, lalu bayar.</p>
                </div>
              </div>
              <div class="catalog-tools">
                <label class="search-box grow">
                  <i data-lucide="search"></i>
                  <input value="${state.query}" oninput="state.query = this.value; renderView(); lucide.createIcons();" placeholder="Cari menu..." />
                </label>
              </div>
              <div class="category-tabs">
                ${["Semua", "Nasi Goreng", "Mie & Kwetiau", "Minuman", "Tambahan"].map(item => `
                  <button class="${state.category === item ? 'active' : ''}" onclick="setCategory('${item}')">${item}</button>
                `).join('')}
              </div>
              <div class="product-grid">
                ${filteredProducts.map(product => `
                  <button class="product-card ${!state.availability[product.id] ? 'sold-out' : ''}" onclick="quickAdd(${product.id})" ${!state.availability[product.id] ? 'disabled' : ''}>
                    <div class="product-photo">
                      <span aria-hidden="true">${product.icon}</span>
                      ${product.popular ? `<b>Favorit</b>` : ''}
                      ${!state.availability[product.id] ? `<em>Habis</em>` : ''}
                    </div>
                    <div class="product-info">
                      <div>
                        <strong>${product.name}</strong>
                        <span>${product.category}</span>
                      </div>
                      <footer>
                        <b>${money(product.price)}</b>
                        <i><i data-lucide="plus"></i></i>
                      </footer>
                    </div>
                  </button>
                `).join('')}
              </div>
            </section>

            <aside class="cart-panel">
              <div class="cart-head">
                <div>
                  <h2>Pesanan baru</h2>
                  <p>${state.cart.reduce((sum, line) => sum + line.qty, 0)} item dipilih</p>
                </div>
                <i data-lucide="shopping-bag"></i>
              </div>
              <label class="field-label">
                Nama pelanggan <span>Opsional</span>
                <input value="${state.customer}" oninput="state.customer = this.value;" placeholder="Pelanggan umum" />
              </label>
              <div class="cart-lines">
                ${state.cart.length === 0 ? `
                  <div class="empty-state">
                    <span>🛍️</span>
                    <strong>Keranjang kosong</strong>
                    <p>Ketuk menu untuk menambah pesanan.</p>
                  </div>
                ` : state.cart.map((line, index) => `
                  <article class="cart-line">
                    <div class="line-icon">${line.icon}</div>
                    <div class="line-copy">
                      <strong>${line.name}</strong>
                      ${line.spicy ? `<span>Pedas: ${line.spicy}</span>` : ''}
                      <b>${money(line.price * line.qty)}</b>
                    </div>
                    <div class="qty-control">
                      <button onclick="changeQty(${index}, -1)"><i data-lucide="minus"></i></button>
                      <span>${line.qty}</span>
                      <button onclick="changeQty(${index}, 1)"><i data-lucide="plus"></i></button>
                    </div>
                  </article>
                `).join('')}
              </div>
              <label class="field-label note-field">
                Catatan pesanan <span>Opsional</span>
                <textarea oninput="state.orderNote = this.value;" placeholder="Contoh: bungkus, tanpa acar">${state.orderNote}</textarea>
              </label>
              <div class="cart-summary">
                <div><span>Subtotal</span><b>${money(cartTotal)}</b></div>
                <div><span>Biaya lain</span><b>Rp0</b></div>
                <div class="grand-total">
                  <span>Total</span>
                  <strong>${money(cartTotal)}</strong>
                </div>
              </div>
              <button class="checkout-btn" ${!state.cart.length ? 'disabled' : ''} onclick="state.paymentOpen = true; render();">
                <span>Lanjut pembayaran</span>
                <strong>${money(cartTotal)}</strong>
                <i data-lucide="chevron-right"></i>
              </button>
            </aside>
          </div>
        `;
      } else if (state.view === "kds") {
        const statuses = ["Diterima", "Sedang Dibuat", "Siap Diambil"];
        container.innerHTML = `
          <div class="view-stack">
            <section class="page-heading">
              <div>
                <p class="eyebrow">MODE DAPUR</p>
                <h1>Produksi pesanan</h1>
                <p>Tampilan besar untuk dibaca sambil memasak dan menyiapkan minuman.</p>
              </div>
              <div class="kds-legend">
                <span><i class="dot orange"></i> Baru</span>
                <span><i class="dot blue"></i> Dimasak</span>
                <span><i class="dot green"></i> Siap</span>
              </div>
            </section>
            <section class="kds-board">
              ${statuses.map(status => {
                const columnOrders = state.orders.filter(o => o.status === status);
                return `
                  <div class="kds-column kds-${status.toLowerCase().replaceAll(" ", "-")}">
                    <header>
                      <div>
                        <span>${status === "Diterima" ? "BARU" : status === "Sedang Dibuat" ? "DIMASAK" : "SIAP"}</span>
                        <h2>${status}</h2>
                      </div>
                      <b>${columnOrders.length}</b>
                    </header>
                    <div class="kds-list">
                      ${columnOrders.length === 0 ? `
                        <div class="empty-state">
                          <span>✓</span><strong>Kosong</strong>
                          <p>Belum ada tiket.</p>
                        </div>
                      ` : columnOrders.map(order => `
                        <article class="kds-ticket">
                          <div class="ticket-head">
                            <div>
                              <strong>${order.id}</strong>
                              <span class="source-badge source-${order.source.toLowerCase()}">${order.source}</span>
                            </div>
                            <b class="${order.elapsed >= 12 ? 'late-time' : ''}">${order.elapsed} mnt</b>
                          </div>
                          <h3>${order.customer}</h3>
                          <ul>
                            ${order.items.map(item => `<li>${item}</li>`).join('')}
                          </ul>
                          ${order.note ? `<p>⚠ ${order.note}</p>` : ''}
                          ${nextStatus[order.status] ? `
                            <button onclick="advanceOrder('${order.id}')">
                              ${nextLabel[order.status]} <i data-lucide="chevron-right"></i>
                            </button>
                          ` : ''}
                        </article>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </section>
          </div>
        `;
      } else if (state.view === "menu") {
        const availableCount = Object.values(state.availability).filter(Boolean).length;
        container.innerHTML = `
          <div class="view-stack">
            <section class="page-heading">
              <div>
                <p class="eyebrow">KETERSEDIAAN HARI INI</p>
                <h1>Menu outlet</h1>
                <p>Matikan menu yang habis agar tidak dapat dipesan.</p>
              </div>
              <div class="menu-count">
                <strong>${availableCount}</strong>
                <span>dari ${products.length} tersedia</span>
              </div>
            </section>
            <section class="menu-management">
              ${products.map(product => `
                <article class="menu-row">
                  <div class="menu-emoji">${product.icon}</div>
                  <div class="menu-copy">
                    <strong>${product.name}</strong>
                    <span>${product.category} · ${money(product.price)}</span>
                  </div>
                  <label class="switch">
                    <input type="checkbox" aria-label="Ubah ketersediaan ${product.name}" ${state.availability[product.id] ? 'checked' : ''} onchange="updateAvailability(${product.id}, this.checked)">
                    <span></span>
                  </label>
                  <b class="${state.availability[product.id] ? 'available' : 'unavailable'}">
                    ${state.availability[product.id] ? 'Tersedia' : 'Habis'}
                  </b>
                </article>
              `).join('')}
            </section>
          </div>
        `;
      }
    }

    function renderModals() {
      const modalContainer = document.getElementById('modalContainer');
      let html = '';

      if (state.moreOpen) {
        html += `
          <div class="modal-backdrop" onclick="state.moreOpen = false; render();">
            <section class="more-sheet" role="dialog" aria-modal="true" aria-labelledby="moreTitle" onclick="event.stopPropagation();">
              <div class="modal-title" style="padding:0 0 14px;">
                <div><p>FITUR SEKUNDER</p><h2 id="moreTitle">Lainnya</h2></div>
                <button class="close-btn" aria-label="Tutup menu lainnya" onclick="state.moreOpen = false; render();"><i data-lucide="x"></i></button>
              </div>
              <p>Fitur operasional utama tetap mudah dijangkau di navigasi bawah.</p>
              <div class="more-grid">
                <button onclick="setView('menu')"><i data-lucide="menu"></i><span><strong>Ketersediaan menu</strong><span>Atur menu tersedia atau habis</span></span></button>
                <button onclick="state.moreOpen = false; showToast('Pengaturan outlet belum tersedia pada prototype', 'info')"><i data-lucide="settings"></i><span><strong>Pengaturan outlet</strong><span>Perangkat, profil, dan preferensi</span></span></button>
              </div>
              <div class="feedback-demo">
                <span>DEMO FEEDBACK AKSI</span>
                <div class="feedback-actions">
                  <button onclick="demoFeedback('success')">Berhasil</button>
                  <button onclick="demoFeedback('info')">Informasi</button>
                  <button onclick="demoFeedback('warning')">Peringatan</button>
                  <button onclick="demoFeedback('error')">Gagal</button>
                </div>
              </div>
            </section>
          </div>
        `;
      }

      // Incoming WhatsApp Modal
      if (state.incoming) {
        html += `
          <div class="modal-backdrop priority-backdrop">
            <section class="incoming-modal" role="dialog" aria-modal="true" aria-label="Pesanan WhatsApp baru">
              <div class="incoming-head">
                <div class="pulse-icon"><i data-lucide="bell-ring"></i></div>
                <div>
                  <p>PESANAN BARU</p>
                  <h2>WhatsApp · Siti Rahma</h2>
                </div>
                <button class="close-btn" onclick="setIncoming(false)"><i data-lucide="x"></i></button>
              </div>
              <div class="incoming-body">
                <div class="incoming-meta">
                  <span>#PH-1264 · 12:08</span>
                  <strong>${money(38000)}</strong>
                </div>
                <ul>
                  <li><b>1×</b> Nasi Goreng Spesial · Pedas</li>
                  <li><b>1×</b> Es Teh Manis</li>
                  <li><b>1×</b> Kerupuk</li>
                </ul>
                <p class="incoming-note">Bungkus, tanpa acar</p>
              </div>
              <div class="incoming-actions">
                <button class="reject-btn" onclick="setIncoming(false)">Tolak</button>
                <button class="accept-btn" onclick="acceptIncoming()"><i data-lucide="check"></i> Terima pesanan</button>
              </div>
            </section>
          </div>
        `;
      }

      // Spicy Option Modal
      if (state.selectedProduct) {
        const prod = state.selectedProduct;
        html += `
          <div class="modal-backdrop" onclick="state.selectedProduct = null; render();">
            <section class="option-modal" onclick="event.stopPropagation();">
              <div class="modal-title">
                <div>
                  <p>TAMBAH KE PESANAN</p>
                  <h2>${prod.name}</h2>
                </div>
                <button class="close-btn" onclick="state.selectedProduct = null; render();"><i data-lucide="x"></i></button>
              </div>
              <div class="dish-preview">
                <span>${prod.icon}</span>
                <div>
                  <b>${money(prod.price)}</b>
                  <p>Pilih tingkat kepedasan sebelum menambahkan.</p>
                </div>
              </div>
              <fieldset>
                <legend>Level pedas <span>Wajib</span></legend>
                <div class="option-grid">
                  ${["Tidak pedas", "Sedang", "Pedas", "Extra pedas"].map(level => `
                    <button class="${state.spicy === level ? 'selected' : ''}" onclick="state.spicy = '${level}'; renderModals(); lucide.createIcons();">
                      <span>${level}</span>
                      ${state.spicy === level ? `<i data-lucide="check"></i>` : ''}
                    </button>
                  `).join('')}
                </div>
              </fieldset>
              <button class="full-primary" onclick="addToCart(state.selectedProduct, state.spicy)">
                <i data-lucide="plus"></i> Tambahkan · ${money(prod.price)}
              </button>
            </section>
          </div>
        `;
      }

      // Payment Modal
      if (state.paymentOpen) {
        const cartTotal = state.cart.reduce((sum, line) => sum + line.price * line.qty, 0);
        html += `
          <div class="modal-backdrop" onclick="state.paymentOpen = false; render();">
            <section class="payment-modal" onclick="event.stopPropagation();">
              <div class="modal-title">
                <div>
                  <p>PEMBAYARAN</p>
                  <h2>Pilih cara bayar</h2>
                </div>
                <button class="close-btn" onclick="state.paymentOpen = false; render();"><i data-lucide="x"></i></button>
              </div>
              <div class="payment-layout">
                <div>
                  <div class="payment-methods">
                    <button class="${state.paymentMethod === 'Tunai' ? 'selected' : ''}" onclick="state.paymentMethod = 'Tunai'; renderModals(); lucide.createIcons();">
                      <i data-lucide="wallet-cards"></i>
                      <div>
                        <strong>Tunai</strong>
                        <span>Hitung kembalian langsung</span>
                      </div>
                      ${state.paymentMethod === 'Tunai' ? `<i data-lucide="check-circle-2"></i>` : ''}
                    </button>
                    <button class="${state.paymentMethod === 'QRIS' ? 'selected' : ''}" onclick="state.paymentMethod = 'QRIS'; renderModals(); lucide.createIcons();">
                      <i data-lucide="smartphone"></i>
                      <div>
                        <strong>QRIS Midtrans</strong>
                        <span>Tampilkan kode pembayaran</span>
                      </div>
                      ${state.paymentMethod === 'QRIS' ? `<i data-lucide="check-circle-2"></i>` : ''}
                    </button>
                  </div>
                  ${state.paymentMethod === 'Tunai' ? `
                    <div class="cash-panel">
                      <p>Uang diterima</p>
                      <div class="cash-presets">
                        ${[50000, 100000, cartTotal].map(amount => `
                          <button class="${state.cash === amount ? 'active' : ''}" onclick="state.cash = ${amount}; renderModals(); lucide.createIcons();">
                            ${amount === cartTotal ? 'Uang pas' : money(amount)}
                          </button>
                        `).join('')}
                      </div>
                      <label>Nominal <input type="number" value="${state.cash}" oninput="state.cash = Number(this.value); renderModals(); lucide.createIcons();" /></label>
                      <div class="change-row">
                        <span>Kembalian</span>
                        <strong>${money(Math.max(0, state.cash - cartTotal))}</strong>
                      </div>
                    </div>
                  ` : `
                    <div class="qris-panel">
                      <div class="qr-placeholder"><span>PH</span></div>
                      <div>
                        <strong>QRIS siap dibuat</strong>
                        <p>Pada aplikasi asli, QR dinamis dibuat oleh Midtrans setelah konfirmasi.</p>
                      </div>
                    </div>
                  `}
                </div>
                <aside class="payment-summary">
                  <i data-lucide="receipt-text"></i>
                  <span>Total pembayaran</span>
                  <strong>${money(cartTotal)}</strong>
                  <p>${state.cart.reduce((sum, line) => sum + line.qty, 0)} item · ${state.customer || 'Pelanggan umum'}</p>
                </aside>
              </div>
              <button class="full-primary" onclick="completePayment()" ${state.paymentMethod === 'Tunai' && state.cash < cartTotal ? 'disabled' : ''}>
                <i data-lucide="check"></i> ${state.paymentMethod === 'Tunai' ? 'Konfirmasi pembayaran' : 'Buat QRIS'}
              </button>
            </section>
          </div>
        `;
      }

      // Order Detail Drawer
      if (state.detail) {
        const order = state.detail;
        const statusList = ["Menunggu", "Diterima", "Sedang Dibuat", "Siap Diambil", "Selesai"];
        const trackStatuses = ["Diterima", "Sedang Dibuat", "Siap Diambil", "Selesai"];
        const currentIndex = statusList.indexOf(order.status);

        html += `
          <div class="modal-backdrop" onclick="state.detail = null; render();">
            <section class="detail-drawer" onclick="event.stopPropagation();">
              <div class="modal-title">
                <div>
                  <p>DETAIL PESANAN</p>
                  <h2>${order.id}</h2>
                </div>
                <button class="close-btn" onclick="state.detail = null; render();"><i data-lucide="x"></i></button>
              </div>
              <div class="detail-customer">
                <div class="customer-avatar large">${order.customer.charAt(0)}</div>
                <div>
                  <h3>${order.customer}</h3>
                  <p>${order.time} · <span class="source-badge source-${order.source.toLowerCase()}">${order.source}</span></p>
                </div>
                <span class="status-pill status-${order.status.toLowerCase().replaceAll(" ", "-")}">${order.status}</span>
              </div>
              <div class="status-track">
                ${trackStatuses.map((st, index) => {
                  const point = index + 1;
                  const done = currentIndex >= point;
                  return `
                    <div class="${done ? 'done' : ''}">
                      <i>${currentIndex > point ? '<i data-lucide="check"></i>' : point}</i>
                      <span>${st}</span>
                    </div>
                  `;
                }).join('')}
              </div>
              <section class="detail-section">
                <h3>Isi pesanan</h3>
                ${order.items.map(item => `<div class="detail-line"><span>${item}</span></div>`).join('')}
                ${order.note ? `<p class="detail-note">Catatan: ${order.note}</p>` : ''}
              </section>
              <section class="detail-section">
                <div class="detail-total">
                  <span>Total</span>
                  <strong>${money(order.total)}</strong>
                </div>
                <div class="payment-chip">
                  <i data-lucide="circle-dollar-sign"></i>
                  <span>${order.paid ? 'Sudah dibayar' : 'Belum dibayar'}</span>
                </div>
              </section>
              ${nextStatus[order.status] ? `
                <button class="full-primary sticky-action" onclick="advanceOrder('${order.id}')">
                  ${nextLabel[order.status]} <i data-lucide="chevron-right"></i>
                </button>
              ` : ''}
            </section>
          </div>
        `;
      }

      modalContainer.innerHTML = html;
    }

    function renderToast() {
      const toastContainer = document.getElementById('toastContainer');
      if (state.toast) {
        const toastMeta = {
          success: ["check-circle-2", "Berhasil"],
          info: ["info", "Informasi"],
          warning: ["triangle-alert", "Perlu perhatian"],
          error: ["circle-x", "Tidak berhasil"]
        }[state.toastType] || ["info", "Informasi"];
        toastContainer.innerHTML = `
          <div class="feedback-toast ${state.toastType}" role="status" aria-live="polite" aria-atomic="true">
            <i data-lucide="${toastMeta[0]}"></i>
            <div><strong>${toastMeta[1]}</strong><span>${state.toast}</span></div>
            <button aria-label="Tutup notifikasi" onclick="state.toast = ''; renderToast();"><i data-lucide="x"></i></button>
          </div>
        `;
      } else {
        toastContainer.innerHTML = '';
      }
    }

    function render() {
      renderNav();
      renderView();
      renderModals();
      renderToast();
      lucide.createIcons();
    }

    // Initial render
    render();
  </script>
</body>
</html>
