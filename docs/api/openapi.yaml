openapi: 3.1.0
info:
  title: PesenHub API
  version: 1.0.0
  description: Shared HTTP primitives for Phase 1A. Domain paths are added by their owning issues.
servers:
  - url: /api/v1
paths:
  /public/menu:
    get:
      summary: Read active and available public catalog
      operationId: getPublicMenu
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - {name: 'filter[category_id]', in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Stable category/menu/modifier ordering, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogResponse'}}}}
  /public/orders/preview:
    post:
      summary: Calculate itemized price and total preview for web orders
      operationId: previewWebOrder
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PreviewInput'}}}
      responses:
        '200': {description: Calculated price preview, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewResponse'}}}}
        '400': {description: Malformed input}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /public/orders:
    post:
      summary: Submit a customer web order without account
      operationId: createWebOrder
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PublicOrderCreate'}}}
      responses:
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/PublicOrderResponse'}}}}
        '201': {description: Web order created, content: {application/json: {schema: {$ref: '#/components/schemas/PublicOrderResponse'}}}}
        '400': {description: Malformed input}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: Rate limited, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /public/orders/{token}:
    get:
      summary: Track public order status using opaque tracking token
      operationId: getPublicOrderTracking
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Public order tracking details without customer phone, content: {application/json: {schema: {$ref: '#/components/schemas/PublicTrackingDetail'}}}}
        '404': {description: Order not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /agent/menu:
    get:
      summary: Read the same safe catalog projection for agent tools
      operationId: getAgentMenu
      responses:
        '200': {description: Active and available catalog, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogResponse'}}}}
  /admin/categories:
    post:
      summary: Create a category
      operationId: createCategory
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Category created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/menus:
    post:
      summary: Create a menu with modifier groups and options atomically
      operationId: createMenu
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Menu created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/menus/{id}/availability:
    patch:
      summary: Update availability with optimistic version
      operationId: updateMenuAvailability
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Availability updated}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /customers:
    post:
      summary: Create or replay a customer profile
      operationId: createCustomer
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}
        '201': {description: Customer created, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /customers/{id}:
    patch:
      summary: Update an authorized customer profile
      operationId: updateCustomer
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerUpdate'}
      responses:
        '200': {description: Customer updated, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /customers/{id}/orders:
    get:
      summary: Read order history for an authorized customer identity
      operationId: getCustomerOrderHistory
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized order history}
        '403': {$ref: '#/components/responses/Forbidden'}
  /orders:
    get:
      summary: List and filter orders with cursor pagination
      operationId: listOrders
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          description: Filter by status (single or comma-separated)
          schema: {type: string}
        - name: source
          in: query
          description: Filter by order source (single or comma-separated)
          schema: {type: string}
        - name: created_from
          in: query
          description: Filter by creation time start (RFC3339)
          schema: {type: string, format: date-time}
        - name: created_to
          in: query
          description: Filter by creation time end (RFC3339)
          schema: {type: string, format: date-time}
      responses:
        '200': {description: Filtered orders with cursor pagination, content: {application/json: {schema: {$ref: '#/components/schemas/OrderCollection'}}}}
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      summary: Create or replay a cashier manual order atomically
      operationId: createManualOrder
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ManualOrderCreate'}}}
      responses:
        '200': {description: Identical idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '201': {description: Pending cashier order created, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /orders/queue:
    get:
      summary: Get active queue snapshot for KDS/Kitchen
      operationId: getOrderQueue
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Active orders in queue
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/OrderDetail'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /orders/{id}:
    get:
      summary: Get order details by ID
      operationId: getOrderByID
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Order details, content: {application/json: {schema: {$ref: '#/components/schemas/OrderDetail'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Order not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /orders/{id}/status-transitions:
    post:
      summary: Apply or replay a legal order status transition
      operationId: transitionOrderStatus
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OrderStatusTransition'}}}
      responses:
        '200': {description: Transition applied or idempotently replayed, content: {application/json: {schema: {$ref: '#/components/schemas/OrderStatusResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Order not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /ws/orders:
    get:
      summary: Real-time WebSocket connection for order events and queue streaming
      operationId: streamOrderEvents
      security: [{bearerAuth: []}]
      parameters:
        - name: token
          in: query
          description: Alternative authentication token for browser environments
          schema: {type: string}
      responses:
        '101': {description: Switching Protocols to WebSocket}
        '400': {description: Invalid WebSocket upgrade headers, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /examples:
    get:
      summary: Contract-only collection example
      operationId: listExamplesContract
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Example collection response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleCollection'
        '400':
          $ref: '#/components/responses/InvalidQuery'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    PageCursor:
      name: page[cursor]
      in: query
      schema:
        type: string
        description: Opaque base64url cursor returned by the server.
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [created_at, -created_at]
        default: created_at
  headers:
    RequestID:
      description: Effective correlation identifier.
      schema:
        type: string
  responses:
    ValidationError:
      description: Semantic input validation failed.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Conflict:
      description: Idempotency, phone identity, or version conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Forbidden:
      description: Authenticated principal cannot access this customer.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    InvalidQuery:
      description: Query parameter validation failed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ModifierSelection:
      type: object
      additionalProperties: false
      required: [group_id, option_ids]
      properties:
        group_id: {type: string, format: uuid}
        option_ids: {type: array, items: {type: string, format: uuid}}
    ManualOrderItemCreate:
      type: object
      additionalProperties: false
      required: [menu_id, quantity]
      properties:
        menu_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 100}
        notes: {type: string}
        modifier_groups: {type: array, items: {$ref: '#/components/schemas/ModifierSelection'}}
    ManualOrderCreate:
      type: object
      additionalProperties: false
      required: [client_order_id, customer_name, items]
      properties:
        client_order_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        customer_name: {type: string, minLength: 1, maxLength: 120}
        customer_phone: {type: string}
        notes: {type: string}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/ManualOrderItemCreate'}}
    OrderItem:
      type: object
      required: [id, menu_id, name, sku, unit_price_amount, quantity, line_total_amount]
      properties:
        id: {type: string, format: uuid}
        menu_id: {type: string, format: uuid}
        name: {type: string}
        sku: {type: string}
        unit_price_amount: {type: integer, format: int64, minimum: 0}
        quantity: {type: integer, minimum: 1}
        line_total_amount: {type: integer, format: int64, minimum: 0}
    Order:
      type: object
      required: [id, order_number, client_order_id, source, status, total_amount, version, created_at, items]
      properties:
        id: {type: string, format: uuid}
        order_number: {type: string}
        client_order_id: {type: string, format: uuid}
        source: {const: CASHIER_MANUAL}
        status: {const: PENDING}
        total_amount: {type: integer, format: int64, minimum: 0}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
    OrderStatusTransition:
      type: object
      additionalProperties: false
      required: [target_status, expected_version]
      properties:
        target_status: {type: string, enum: [ACCEPTED, PREPARING, READY_FOR_PICKUP, COMPLETED, REJECTED, CANCELLED]}
        expected_version: {type: integer, minimum: 1}
        reason_code: {type: string, maxLength: 64}
    OrderStatusResult:
      type: object
      additionalProperties: false
      required: [id, status, version]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, ACCEPTED, PREPARING, READY_FOR_PICKUP, COMPLETED, REJECTED, CANCELLED]}
        version: {type: integer, minimum: 1}
    ModifierSnapshot:
      type: object
      required: [id, name, price_delta_amount]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        price_delta_amount: {type: integer, format: int64}
    OrderItemDetail:
      type: object
      required: [id, menu_id, name, sku, unit_price_amount, quantity, line_total_amount]
      properties:
        id: {type: string, format: uuid}
        menu_id: {type: string, format: uuid}
        name: {type: string}
        sku: {type: string}
        category_name: {type: string}
        quantity: {type: integer, minimum: 1}
        unit_price_amount: {type: integer, format: int64, minimum: 0}
        line_total_amount: {type: integer, format: int64, minimum: 0}
        notes: {type: string}
        modifiers:
          type: array
          items: {$ref: '#/components/schemas/ModifierSnapshot'}
    OrderStatusHistoryEntry:
      type: object
      required: [to_status, order_version, actor_type, created_at]
      properties:
        from_status: {type: string}
        to_status: {type: string}
        order_version: {type: integer, minimum: 1}
        actor_type: {type: string}
        actor_id: {type: string}
        reason_code: {type: string}
        created_at: {type: string, format: date-time}
    OrderDetail:
      type: object
      required: [id, order_number, source, status, customer_name, total_amount, version, created_at, updated_at, items]
      properties:
        id: {type: string, format: uuid}
        order_number: {type: string}
        client_order_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        source: {type: string, enum: [CASHIER_MANUAL, CUSTOMER_WEB, WHATSAPP]}
        status: {type: string, enum: [PENDING, ACCEPTED, PREPARING, READY_FOR_PICKUP, COMPLETED, REJECTED, CANCELLED]}
        customer_name: {type: string}
        customer_phone: {type: string, nullable: true}
        notes: {type: string}
        total_amount: {type: integer, format: int64, minimum: 0}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItemDetail'}
        history:
          type: array
          items: {$ref: '#/components/schemas/OrderStatusHistoryEntry'}
    OrderCollection:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/OrderDetail'}
        page:
          $ref: '#/components/schemas/PageMeta'
    OrderEventEnvelope:
      type: object
      required: [event_id, event_type, order_id, version, status, timestamp, payload]
      properties:
        event_id: {type: string, format: uuid}
        event_type: {type: string, enum: [ORDER_CREATED, ORDER_STATUS_CHANGED]}
        order_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        source: {type: string}
        status: {type: string}
        timestamp: {type: string, format: date-time}
        payload: {type: object}
    ModifierOption:
      type: object
      required: [id, code, name, price_delta_amount, is_available, sort_order]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        price_delta_amount: {type: integer, format: int64}
        is_available: {type: boolean}
        sort_order: {type: integer, minimum: 0}
    ModifierGroup:
      type: object
      required: [id, code, name, min_select, max_select, is_active, sort_order, options]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        min_select: {type: integer, minimum: 0}
        max_select: {type: integer, minimum: 1}
        is_active: {type: boolean}
        sort_order: {type: integer, minimum: 0}
        options: {type: array, items: {$ref: '#/components/schemas/ModifierOption'}}
    CatalogMenu:
      type: object
      required: [id, category_id, sku, name, price_amount, is_available, version, sort_order, modifier_groups]
      properties:
        id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
        sku: {type: string}
        name: {type: string}
        price_amount: {type: integer, format: int64, minimum: 0}
        is_available: {type: boolean}
        version: {type: integer, minimum: 1}
        sort_order: {type: integer, minimum: 0}
        modifier_groups: {type: array, items: {$ref: '#/components/schemas/ModifierGroup'}}
    CatalogCategory:
      type: object
      required: [id, name, sort_order, is_active, menus]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sort_order: {type: integer, minimum: 0}
        is_active: {type: boolean}
        menus: {type: array, items: {$ref: '#/components/schemas/CatalogMenu'}}
    CatalogResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CatalogCategory'}}
    CustomerCreate:
      type: object
      additionalProperties: false
      required: [phone, display_name]
      properties:
        phone: {type: string}
        display_name: {type: string, minLength: 1, maxLength: 120}
        preferences: {type: object, additionalProperties: true}
    CustomerUpdate:
      type: object
      additionalProperties: false
      required: [display_name, preferences, version]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        preferences: {type: object, additionalProperties: true}
        version: {type: integer, minimum: 1}
    Customer:
      type: object
      additionalProperties: false
      required: [id, phone_e164, display_name, preferences, version]
      properties:
        id: {type: string, format: uuid}
        phone_e164: {type: string, pattern: '^\+62[0-9]{9,12}$'}
        display_name: {type: string}
        preferences: {type: object, additionalProperties: true}
        version: {type: integer, minimum: 1}
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    PageMeta:
      type: object
      additionalProperties: false
      required: [size, next_cursor]
      properties:
        size:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: [string, 'null']
    Example:
      type: object
      additionalProperties: false
      required: [id, created_at]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
    ExampleCollection:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Example'
        page:
          $ref: '#/components/schemas/PageMeta'
    PublicOrderCreate:
      type: object
      required: [customer_name, customer_phone, items]
      properties:
        customer_name: {type: string, minLength: 1, maxLength: 120}
        customer_phone: {type: string, pattern: '^(?:\+628|08|628)[0-9]{7,12}$'}
        notes: {type: string}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/OrderItemInput'}
    PublicOrderResponse:
      type: object
      required: [order_number, public_tracking_token, status, total_amount, created_at]
      properties:
        order_number: {type: string}
        public_tracking_token: {type: string}
        status: {type: string}
        total_amount: {type: integer, format: int64, minimum: 0}
        created_at: {type: string, format: date-time}
    PreviewInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/OrderItemInput'}
    PreviewResponse:
      type: object
      required: [subtotal_amount, total_amount, items]
      properties:
        subtotal_amount: {type: integer, format: int64, minimum: 0}
        total_amount: {type: integer, format: int64, minimum: 0}
        items:
          type: array
          items:
            type: object
            required: [menu_id, name, quantity, unit_price_amount, line_total_amount]
            properties:
              menu_id: {type: string, format: uuid}
              name: {type: string}
              quantity: {type: integer, minimum: 1}
              unit_price_amount: {type: integer, format: int64}
              line_total_amount: {type: integer, format: int64}
              modifiers:
                type: array
                items: {$ref: '#/components/schemas/ModifierSnapshot'}
    PublicTrackingDetail:
      type: object
      required: [order_number, status, customer_name, total_amount, created_at, updated_at, items]
      properties:
