openapi: 3.1.0
info:
  title: PesenHub API
  version: 1.0.0
  description: Shared HTTP primitives for Phase 1A. Domain paths are added by their owning issues.
servers:
  - url: /api/v1
paths:
  /customers:
    post:
      summary: Create or replay a customer profile
      operationId: createCustomer
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}
        '201': {description: Customer created, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /customers/{id}:
    patch:
      summary: Update an authorized customer profile
      operationId: updateCustomer
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerUpdate'}
      responses:
        '200': {description: Customer updated, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /customers/{id}/orders:
    get:
      summary: Read order history for an authorized customer identity
      operationId: getCustomerOrderHistory
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized order history}
        '403': {$ref: '#/components/responses/Forbidden'}
  /examples:
    get:
      summary: Contract-only collection example
      operationId: listExamplesContract
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Example collection response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleCollection'
        '400':
          $ref: '#/components/responses/InvalidQuery'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    PageCursor:
      name: page[cursor]
      in: query
      schema:
        type: string
        description: Opaque base64url cursor returned by the server.
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [created_at, -created_at]
        default: created_at
  headers:
    RequestID:
      description: Effective correlation identifier.
      schema:
        type: string
  responses:
    ValidationError:
      description: Semantic input validation failed.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Conflict:
      description: Idempotency, phone identity, or version conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Forbidden:
      description: Authenticated principal cannot access this customer.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    InvalidQuery:
      description: Query parameter validation failed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    CustomerCreate:
      type: object
      additionalProperties: false
      required: [phone, display_name]
      properties:
        phone: {type: string}
        display_name: {type: string, minLength: 1, maxLength: 120}
        preferences: {type: object, additionalProperties: true}
    CustomerUpdate:
      type: object
      additionalProperties: false
      required: [display_name, preferences, version]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        preferences: {type: object, additionalProperties: true}
        version: {type: integer, minimum: 1}
    Customer:
      type: object
      additionalProperties: false
      required: [id, phone_e164, display_name, preferences, version]
      properties:
        id: {type: string, format: uuid}
        phone_e164: {type: string, pattern: '^\+62[0-9]{9,12}$'}
        display_name: {type: string}
        preferences: {type: object, additionalProperties: true}
        version: {type: integer, minimum: 1}
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    PageMeta:
      type: object
      additionalProperties: false
      required: [size, next_cursor]
      properties:
        size:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: [string, 'null']
    Example:
      type: object
      additionalProperties: false
      required: [id, created_at]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
    ExampleCollection:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Example'
        page:
          $ref: '#/components/schemas/PageMeta'
